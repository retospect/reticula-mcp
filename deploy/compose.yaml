# One Reticula instance: Postgres with pgvector, and the MCP server from PyPI.
#
#   cp .env.example .env      # then set RETICULA_DB_PASSWORD (and RETICULA_PUBLIC_URL)
#   docker compose up -d --build
#
# The server is published on 127.0.0.1 only. Put a tunnel or reverse proxy that
# terminates TLS in front of it, set RETICULA_PUBLIC_URL to that address and
# RETICULA_TRUSTED_PROXIES as docs/operating.md describes.
#
# To run a checkout with these settings, add compose.source.yaml. For a
# separate development stack beside this one, use compose.dev.yaml.
name: reticula

# Docker's log of each container is kept to 5 files of 10 MB, so a flood of
# requests cannot fill the disk that the database volume shares.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    logging: *logging
    # The image starts as root, sets the owner of the data directory and
    # becomes the postgres user: these five capabilities, and no other.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    # Only the server reaches the database: the network has no route out and
    # no other service of the stack joins it.
    networks: [database]
    # The superuser is reticula_admin, for the operator only. On an empty data
    # directory db-init/10-owner-role.sh makes the role reticula, which the
    # server connects as: it owns the database and has no superuser rights.
    # These settings act only on an empty data directory; an install from
    # before keeps its roles until the steps in docs/operating.md, Upgrade.
    environment:
      POSTGRES_USER: reticula_admin
      POSTGRES_PASSWORD: ${RETICULA_DB_ADMIN_PASSWORD:?set RETICULA_DB_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      RETICULA_DB_PASSWORD: ${RETICULA_DB_PASSWORD:?set RETICULA_DB_PASSWORD in .env}
    volumes:
      - reticula-db:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reticula -d reticula"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        RETICULA_VERSION: ${RETICULA_VERSION:?set RETICULA_VERSION in .env}
        # The embedding model is built into the image, so the image holds the
        # model the server is told to use. Another model needs a new build:
        # docker compose up -d --build.
        RETICULA_EMBED_MODEL: ${RETICULA_EMBED_MODEL:-BAAI/bge-base-en-v1.5}
    restart: unless-stopped
    logging: *logging
    # The server with the default model uses about 0.6 GB; a `reindex` run in
    # this container loads the model a second time. A larger model needs more:
    # set RETICULA_APP_MEMORY in .env (docs/operating.md, Choose a model).
    mem_limit: ${RETICULA_APP_MEMORY:-2g}
    pids_limit: 512
    # The server runs as its own user and needs no capability.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [default, database]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The password goes to the database driver as PGPASSWORD, so it needs no
      # escaping in the URL whatever characters it has.
      RETICULA_DATABASE_URL: postgresql://reticula@db:5432/reticula
      PGPASSWORD: ${RETICULA_DB_PASSWORD}
      # The server listens on 0.0.0.0 inside the container, so it cannot guess
      # the address clients use. Without a public URL that is the published
      # port on this machine.
      RETICULA_PUBLIC_URL: ${RETICULA_PUBLIC_URL:-http://127.0.0.1:${RETICULA_PORT:-8787}}
      RETICULA_HOST: 0.0.0.0
      RETICULA_PORT: "8787"
      RETICULA_SIGNUP: ${RETICULA_SIGNUP:-open}
      RETICULA_SIGNUP_RATE: ${RETICULA_SIGNUP_RATE:-5/hour}
      RETICULA_REGISTER_RATE: ${RETICULA_REGISTER_RATE:-20/hour}
      RETICULA_WRITE_RATE: ${RETICULA_WRITE_RATE:-600/hour}
      RETICULA_ACTIVITY_DAYS: ${RETICULA_ACTIVITY_DAYS:-30}
      RETICULA_EMBEDDER: ${RETICULA_EMBEDDER:-auto}
      RETICULA_EMBED_MODEL: ${RETICULA_EMBED_MODEL:-BAAI/bge-base-en-v1.5}
      RETICULA_TRUSTED_PROXIES: ${RETICULA_TRUSTED_PROXIES:-}
      RETICULA_KNOWN_CLIENTS: ${RETICULA_KNOWN_CLIENTS:-claude.ai,claude.com}
      RETICULA_ALLOW_NEWER_SCHEMA: ${RETICULA_ALLOW_NEWER_SCHEMA:-}
      # The secret that encrypts the accounts' private keys in the database.
      # It is not in the database or its dumps; docs/operating.md, "The key
      # file", says how to make it and keep a copy.
      RETICULA_KEY_FILE: /run/secrets/reticula_key
    secrets: [reticula_key]
    ports:
      - "127.0.0.1:${RETICULA_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "reticula-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

# A fixed subnet, so the address the server sees for this host is known: a
# tunnel or reverse proxy running on this machine reaches the published port
# from the network's gateway, the first address of the subnet (172.31.88.1).
# That is the value for RETICULA_TRUSTED_PROXIES; see docs/operating.md.
networks:
  default:
    ipam:
      config:
        - subnet: ${RETICULA_SUBNET:-172.31.88.0/24}
  database:
    internal: true

volumes:
  reticula-db:

# Mounted into the server at /run/secrets/reticula_key with the owner and mode
# the file has on this machine: on Linux it must belong to uid 10001 with mode
# 600; with Docker on a Mac, to your own user with mode 600.
secrets:
  reticula_key:
    file: ./secrets/reticula.key

# Pull requests for newer versions of what the project depends on: the
# Python packages of uv.lock, the GitHub Actions of the workflows, and the
# base images of deploy/Dockerfile. Each is a proposal; check.yml runs on it.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly

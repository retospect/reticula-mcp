name: Check

on:
  push:
    branches: [main]
  pull_request:
  # workflow.yml runs these checks on the tagged commit before it builds
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole job takes about three minutes. Two runs stood in the test
    # step for over twenty minutes on 2026-11-25 (cause and cure:
    # tests/conftest.py, _no_autovacuum and end_connection); this ends a
    # run that stands still for another reason.
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RETICULA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.10"
      - run: uv sync --locked
      - name: deploy/requirements.txt is the export of uv.lock the image installs
        run: |
          uv export --frozen --no-dev --no-emit-project --extra fastembed \
            --format requirements-txt -o deploy/requirements.txt
          git diff --exit-code deploy/requirements.txt
      - name: No known vulnerability in the locked dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --all-extras \
            --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # -rs prints why a test was skipped, so a skipped end-to-end test shows.
      # -v: the log names the test that was running when a run stands still.
      - run: uv run pytest -v -rs
      - name: Golden vectors are up to date with the format library
        run: |
          uv run python scripts/gen_vectors.py
          git diff --exit-code tests/vectors
      - run: uv build
      - name: The wheel is complete and its command runs
        run: scripts/check-wheel

  # The container image, built from the checkout, with the database beside it:
  # the server starts, runs as its own user, and an assistant's whole path
  # works (discovery, sign-up, token, the tools over MCP).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keyword search only, so the job does not depend on a model download.
      RETICULA_DEV_EMBEDDER: hash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.10"
      - name: The production compose files are valid
        run: >-
          RETICULA_DB_PASSWORD=check RETICULA_VERSION=0.0.0
          docker compose -f deploy/compose.yaml -f deploy/compose.source.yaml config --quiet
      - name: Build the image and start the stack
        run: docker compose -f deploy/compose.dev.yaml up -d --build --wait
      - name: The server does not run as root
        run: test "$(docker compose -f deploy/compose.dev.yaml exec -T app id -u)" = 10001
      - name: Smoke test
        run: scripts/smoke http://127.0.0.1:8788
      # The same sign-in, walked by the OAuth client of the MCP Python SDK, and a
      # token refresh. Like the smoke test it counts as one sign-up.
      - name: Sign-in and refresh with the MCP Python SDK's OAuth client
        run: scripts/oauth-client-check http://127.0.0.1:8788
      # docs/operating.md says a request from the host arrives from the gateway
      # of the compose network. This prints both on Linux; it does not judge.
      - name: Address a request from the host arrives from
        run: |
          docker compose version
          curl -s -o /dev/null http://127.0.0.1:8788/healthz
          sleep 1
          echo "gateway of the network: $(docker network inspect reticula-dev_default --format '{{(index .IPAM.Config 0).Gateway}}')"
          echo "peer of the request:    $(docker compose -f deploy/compose.dev.yaml logs --no-log-prefix app | grep 'GET /healthz' | grep -v ' 127.0.0.1:' | tail -1)"
      - name: Container logs
        if: always()
        run: docker compose -f deploy/compose.dev.yaml logs --no-color --tail 200

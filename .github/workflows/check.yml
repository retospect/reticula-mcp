name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RETICULA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # -rs prints why a test was skipped, so a skipped end-to-end test shows.
      - run: uv run pytest -q -rs
      - name: Golden vectors are up to date with the format library
        run: |
          uv run python scripts/gen_vectors.py
          git diff --exit-code tests/vectors
      - run: uv build
      - name: The wheel is complete and its command runs
        run: scripts/check-wheel

  # The container image, built from the checkout, with the database beside it:
  # the server starts, runs as its own user, and an assistant's whole path
  # works (discovery, sign-up, token, the tools over MCP).
  image:
    runs-on: ubuntu-latest
    env:
      # Keyword search only, so the job does not depend on a model download.
      RETICULA_DEV_EMBEDDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The production compose files are valid
        run: >-
          RETICULA_DB_PASSWORD=check RETICULA_VERSION=0.0.0
          docker compose -f deploy/compose.yaml -f deploy/compose.source.yaml config --quiet
      - name: Build the image and start the stack
        run: docker compose -f deploy/compose.dev.yaml up -d --build --wait
      - name: The server does not run as root
        run: test "$(docker compose -f deploy/compose.dev.yaml exec -T app id -u)" = 10001
      - name: Smoke test
        run: scripts/smoke http://127.0.0.1:8788
      - name: Container logs
        if: always()
        run: docker compose -f deploy/compose.dev.yaml logs --no-color --tail 200
